<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register | Swad-e-Dil</title>
  <link rel="icon" type="image/jpeg" href="assets/Swad-e-dil_Logo.jpg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/responsive.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>

<body>
  <nav class="navbar">
    <div class="navbar-container container">
      <input type="checkbox" id="menu-toggle" />
      <label for="menu-toggle" class="hamburger-lines" aria-label="Toggle navigation menu">
        <span class="line line1"></span>
        <span class="line line2"></span>
        <span class="line line3"></span>
      </label>
      <ul class="menu-items">
        <li><a href="index.html#home">Home</a></li>
        <li><a href="index.html#about">About</a></li>
        <li><a href="index.html#food-menu">Menu</a></li>
        <li><a href="login.html">Login</a></li>
      </ul>
      <h1 class="logo">Swad-e-Dil</h1>
      <div class="user-actions">
        <button id="theme-toggle" class="theme-toggle" aria-label="Toggle dark mode">
          <i class="fas fa-moon"></i>
        </button>
      </div>
    </div>
  </nav>

  <section class="auth-page">
    <div class="auth-container container">
      <div class="auth-layout">
        <div class="auth-hero">
          <img src="assets/portfolio banner.jpg" alt="Swad-e-Dil register image" />
          <div class="hero-overlay">
            <p>Join our family</p>
            <h2>Create your account</h2>
            <p>Register now to save favorites, track your orders, and enjoy faster checkout.</p>
          </div>
        </div>
        <div class="auth-panel">
          <h2>Register</h2>
          <p class="form-subtitle">Create a new account to begin ordering delicious meals.</p>
          <form id="register-form" novalidate>
            <input type="text" id="register-name" placeholder="Your Name" required />
            <input type="email" id="register-email" placeholder="Email address" required />
            <input type="password" id="register-password" placeholder="Password" required />
            <input type="password" id="register-password-confirm" placeholder="Confirm password" required />
            <button type="submit" class="btn btn-primary">Register</button>
          </form>
          <p class="auth-footer">Already have an account? <a href="login.html">Login here</a></p>
        </div>
      </div>
    </div>
  </section>

  <div id="toast" class="toast-message hidden"></div>
  <script src="js/app.js" defer></script>
</body>

</html>
